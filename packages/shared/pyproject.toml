[project]
name = "careerpilot-shared"
version = "0.1.0"
description = "CareerPilot shared core: career pool, JD analysis, honesty guard, tailoring"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["careerpilot_shared"]
